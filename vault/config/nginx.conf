# ──────────────────────────────────────────────────────────────────────────────
# MOI01.VIP — Nginx Reverse Proxy Configuration
#
# INSTALLATION:
#   1. sudo cp vault/config/nginx.conf /etc/nginx/sites-available/moi01.vip
#   2. sudo ln -s /etc/nginx/sites-available/moi01.vip /etc/nginx/sites-enabled/
#   3. sudo rm -f /etc/nginx/sites-enabled/default
#   4. sudo nginx -t
#   5. sudo systemctl reload nginx
#   6. Run certbot:  sudo certbot --nginx -d moi01.vip
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=vault_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name moi01.vip;

    # ── Payload Size Limit (Nginx-Level Enforcement) ──
    client_max_body_size 1m;

    # ── Security Headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    # ── Reverse Proxy to Node.js ──
    location / {
        limit_req zone=vault_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Disable buffering — data stays in RAM, not written to temp files
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

