<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MOI01.VIP — Zero-Knowledge Ephemeral Vault. Secure file intake and transmission.">
    <title>MOI01.VIP — Secure Intake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Prevent Theme Flashing (FOUC) -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'system';
            let active = theme;
            if (theme === 'system') {
                active = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', active);
        })();
    </script>

    <style>
        :root {
            /* Dark Mode (Default) */
            --bg-primary: #080b10;
            --bg-card: rgba(16, 22, 35, 0.75);
            --bg-card-hover: rgba(22, 30, 48, 0.85);
            --border: rgba(56, 78, 119, 0.35);
            --border-glow: rgba(34, 197, 94, 0.4);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #22c55e;
            --accent-green-dim: rgba(34, 197, 94, 0.15);
            --accent-red: #ef4444;
            --accent-red-dim: rgba(239, 68, 68, 0.15);
            --accent-blue: #3b82f6;
            --grid-line: rgba(34, 197, 94, 0.03);
            --glow: rgba(34, 197, 94, 0.06);
            --file-bg: rgba(30, 41, 59, 0.5);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        /* Light Mode */
        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(241, 245, 249, 0.95);
            --border: rgba(15, 23, 42, 0.1);
            --border-glow: rgba(34, 197, 94, 0.4);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent-green: #16a34a;
            --accent-green-dim: rgba(22, 163, 74, 0.1);
            --accent-red: #dc2626;
            --accent-red-dim: rgba(220, 38, 38, 0.1);
            --accent-blue: #2563eb;
            --grid-line: rgba(15, 23, 42, 0.04);
            --glow: rgba(34, 197, 94, 0.1);
            --file-bg: rgba(241, 245, 249, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridShift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(60px, 60px);
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 0 20px;
        }

        /* ─── Theme Switcher ─── */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-switcher input[type="radio"] {
            display: none;
        }

        .theme-switcher label {
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .theme-switcher label:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .theme-switcher input[type="radio"]:checked+label {
            background: var(--accent-green-dim);
            color: var(--accent-green);
        }

        .theme-switcher svg {
            width: 16px;
            height: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-green-dim);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
            margin-bottom: 16px;
        }

        .header-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--border);
            filter: brightness(1.05);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent-green);
            background: var(--accent-green-dim);
        }

        .drop-zone-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .drop-zone-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .drop-zone-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-info {
            display: none;
            align-items: center;
            gap: 12px;
            background: var(--file-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 16px;
        }

        .file-info.visible {
            display: flex;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--accent-green-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .file-details {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            margin-top: 2px;
        }

        .file-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }

        .file-remove:hover {
            color: var(--accent-red);
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.4);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn.loading {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: flex-start;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        .status.visible {
            display: flex;
        }

        .status.success {
            background: var(--accent-green-dim);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--accent-green);
        }

        .status.error {
            background: var(--accent-red-dim);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
        }

        .status-icon {
            font-size: 16px;
            flex-shrink: 0;
            line-height: 1.4;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .footer-lock {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        @media (max-width: 560px) {
            .container {
                padding: 0 16px;
            }

            .card {
                padding: 24px;
            }

            h1 {
                font-size: 22px;
            }

            .theme-switcher {
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- Theme Switcher (Top Right) -->
    <div class="theme-switcher">
        <input type="radio" id="theme-system" name="theme" value="system" checked>
        <label for="theme-system" title="Follow System Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </label>

        <input type="radio" id="theme-dark" name="theme" value="dark">
        <label for="theme-dark" title="Dark Mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </label>

        <input type="radio" id="theme-light" name="theme" value="light">
        <label for="theme-light" title="Light Mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </label>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-badge">Vault Online</div>
            <h1>MOI01.VIP</h1>
            <p class="subtitle">Zero-Knowledge Ephemeral Vault</p>
        </div>

        <div class="card">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="jsonFile" accept=".json" aria-label="Select JSON file to upload">
                <div class="drop-zone-icon">📄</div>
                <div class="drop-zone-text">Drop a JSON file or click to browse</div>
                <div class="drop-zone-hint">Maximum payload: 1 MB · .json files only</div>
            </div>

            <div class="file-info" id="fileInfo">
                <div class="file-icon">📋</div>
                <div class="file-details">
                    <div class="file-name" id="fileName">—</div>
                    <div class="file-size" id="fileSize">—</div>
                </div>
                <button class="file-remove" id="fileRemove" title="Remove file"
                    aria-label="Remove selected file">✕</button>
            </div>

            <button class="submit-btn" id="sendBtn" disabled>
                <span class="spinner"></span>
                <span class="btn-text">Select a file to transmit</span>
            </button>

            <div class="status" id="status" role="alert" aria-live="assertive">
                <span class="status-icon"></span>
                <span class="status-text"></span>
            </div>
        </div>

        <div class="footer">
            <span class="footer-lock">🔒 All data processed in volatile RAM · Zero disk persistence</span>
        </div>
    </div>

    <script>
        (() => {
            "use strict";

            /* ─── Theme Switching Logic ─── */
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

            function applyTheme(theme) {
                let active = theme;
                if (theme === 'system') {
                    active = mediaQuery.matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', active);
            }

            // Load saved theme and sync radio buttons
            const savedTheme = localStorage.getItem('theme') || 'system';
            const radioToCheck = document.querySelector(`input[name="theme"][value="${savedTheme}"]`);
            if (radioToCheck) radioToCheck.checked = true;
            applyTheme(savedTheme);

            // Listen to OS changes (only if set to system)
            mediaQuery.addEventListener('change', (e) => {
                if (document.querySelector('input[name="theme"]:checked').value === 'system') {
                    applyTheme('system');
                }
            });

            // Listen to manual radio button clicks
            document.querySelectorAll('input[name="theme"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    localStorage.setItem('theme', e.target.value);
                    applyTheme(e.target.value);
                });
            });

            /* ─── Vault Submission Logic ─── */
            const dropZone = document.getElementById("dropZone");
            const fileInput = document.getElementById("jsonFile");
            const fileInfo = document.getElementById("fileInfo");
            const fileName = document.getElementById("fileName");
            const fileSize = document.getElementById("fileSize");
            const fileRemove = document.getElementById("fileRemove");
            const sendBtn = document.getElementById("sendBtn");
            const btnText = sendBtn.querySelector(".btn-text");
            const statusEl = document.getElementById("status");

            const MAX_BYTES = 1 * 1024 * 1024; // 1MB limit to match server
            let selectedFile = null;

            function formatBytes(bytes) {
                if (bytes === 0) return "0 B";
                const units = ["B", "KB", "MB", "GB"];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 2 : 0) + " " + units[i];
            }

            function showStatus(type, icon, message) {
                statusEl.className = `status visible ${type}`;
                statusEl.querySelector(".status-icon").textContent = icon;
                statusEl.querySelector(".status-text").textContent = message;
            }

            function hideStatus() {
                statusEl.className = "status";
            }

            function handleFile(file) {
                if (!file) return;

                if (!file.name.toLowerCase().endsWith(".json")) {
                    showStatus("error", "⚠️", "Invalid file type. Only .json files are accepted.");
                    return;
                }

                selectedFile = file;
                fileName.textContent = file.name;
                fileSize.textContent = formatBytes(file.size);
                fileInfo.classList.add("visible");
                dropZone.style.display = "none";
                hideStatus();

                // Check size and disable button if too large
                if (file.size > MAX_BYTES) {
                    sendBtn.disabled = true;
                    btnText.textContent = "File Exceeds Limit";
                    showStatus("error", "⚠️", `File is ${formatBytes(file.size)} — exceeds the 1 MB limit and cannot be transmitted.`);
                } else {
                    sendBtn.disabled = false;
                    btnText.textContent = "Transmit to Vault";
                }
            }

            function removeFile() {
                selectedFile = null;
                fileInput.value = "";
                fileInfo.classList.remove("visible");
                dropZone.style.display = "";
                sendBtn.disabled = true;
                btnText.textContent = "Select a file to transmit";
                hideStatus();
            }

            fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));
            fileRemove.addEventListener("click", removeFile);

            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("dragover");
            });

            dropZone.addEventListener("dragleave", () => {
                dropZone.classList.remove("dragover");
            });

            dropZone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropZone.classList.remove("dragover");
                const file = e.dataTransfer.files[0];
                if (file) handleFile(file);
            });

            sendBtn.addEventListener("click", async () => {
                if (!selectedFile || sendBtn.disabled) return;

                sendBtn.disabled = true;
                sendBtn.classList.add("loading");
                btnText.textContent = "Transmitting...";
                hideStatus();

                try {
                    const text = await selectedFile.text();

                    // Validate JSON before sending
                    try {
                        JSON.parse(text);
                    } catch {
                        showStatus("error", "❌", "Invalid JSON: The file does not contain valid JSON.");
                        sendBtn.disabled = false;
                        sendBtn.classList.remove("loading");
                        btnText.textContent = "Transmit to Vault";
                        return;
                    }

                    const response = await fetch("/api/submit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: text,
                    });

                    if (response.ok) {
                        const data = await response.json();
                        showStatus(
                            "success",
                            "✅",
                            `Payload processed (${formatBytes(data.bytesProcessed || selectedFile.size)}). RAM wiped. ${data.status === "relayed" ? "Relayed to destination." : "No webhook — data discarded."}`
                        );
                    } else if (response.status === 413) {
                        showStatus("error", "🛡️", "Error 413: Payload exceeds RAM limits. Dropped at edge.");
                    } else if (response.status === 400) {
                        const data = await response.json().catch(() => ({}));
                        showStatus("error", "❌", data.message || "Bad request.");
                    } else if (response.status === 502) {
                        showStatus("error", "⚠️", "Payload processed in RAM but relay to destination failed. Data discarded.");
                    } else {
                        showStatus("error", "❌", `Unexpected response: HTTP ${response.status}`);
                    }
                } catch (err) {
                    showStatus("error", "🔌", "Connection error. The vault may be offline.");
                } finally {
                    // Reset button state only if it's not stuck in an error state
                    if (selectedFile && selectedFile.size <= MAX_BYTES) {
                        sendBtn.disabled = false;
                        sendBtn.classList.remove("loading");
                        btnText.textContent = "Transmit to Vault";
                    } else {
                        sendBtn.classList.remove("loading");
                    }
                }
            });
        })();
    </script>
</body>

</html>
