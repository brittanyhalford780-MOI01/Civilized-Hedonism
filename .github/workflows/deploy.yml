# ──────────────────────────────────────────────────────────────────────────────
# MOI01.VIP — CI/CD Deployment Pipeline
#
# Trigger: Push to 'main' branch
# Action:  SSH into production server, inject secrets, pull code, restart service
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Zero-Knowledge Vault

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Secure Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -euo pipefail

            echo "═══════════════════════════════════════════"
            echo "  MOI01.VIP — Production Deployment"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════"

            # 0. Initial Server Bootstrap (if server directory does not exist yet)
            if [ ! -d "/var/www/moi01.vip/.git" ]; then
              echo "▸ Initializing production directory /var/www/moi01.vip..."
              sudo mkdir -p /var/www/moi01.vip
              sudo chown -R ubuntu:ubuntu /var/www/moi01.vip
              sudo git clone https://github.com/${{ github.repository }}.git /var/www/moi01.vip
              cd /var/www/moi01.vip
              chmod +x tools/server-init.sh
              sudo ./tools/server-init.sh || true
            fi

            # 1. Inject Secrets (Root-Locked Config)
            echo "▸ Injecting secrets into /etc/myapp/config.env..."
            sudo mkdir -p /etc/myapp
            sudo bash -c 'cat > /etc/myapp/config.env << ENVEOF
            PORT=3000
            WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}
            API_KEY=${{ secrets.API_KEY }}
            ENVEOF'
            sudo chown root:root /etc/myapp/config.env
            sudo chmod 600 /etc/myapp/config.env

            # 2. Pull Latest Code
            echo "▸ Pulling latest code from main..."
            cd /var/www/moi01.vip
            sudo git fetch origin main
            sudo git reset --hard origin/main

            # 3. Install App Dependencies
            echo "▸ Installing Node.js dependencies in app..."
            cd /var/www/moi01.vip/app
            sudo npm install --production --no-audit --no-fund

            # 4. Restart Service
            echo "▸ Restarting moi01.service..."
            sudo systemctl daemon-reload
            sudo systemctl restart moi01.service

            # 5. Verify Health
            sleep 2
            if sudo systemctl is-active --quiet moi01.service; then
              echo "✅ Deployment successful — moi01.service is active"
            else
              echo "❌ Deployment FAILED — service not active"
              sudo journalctl -u moi01.service -n 20 --no-pager
              exit 1
            fi
